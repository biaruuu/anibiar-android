name: anibiar
description: AniBiar - anime streaming for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
