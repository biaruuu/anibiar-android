name: Build APK

on:
  push:
    branches: [main, kotlin]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the APK
        id: build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ANIVEXA_URL: ${{ secrets.ANIVEXA_URL || vars.ANIVEXA_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain --no-daemon 2>&1 | tee build.log

      - name: Show the compile errors (so they can be read quickly)
        if: failure()
        run: |
          {
            grep -E "^e: |error:|What went wrong|Execution failed|Could not " build.log | head -60 || true
          } > errors.txt
          cat errors.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' errors.txt | awk '{printf "%s%%0A", $0}' | cut -c1-60000)
          echo "::error title=Kotlin build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: AniBiar-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish to Releases (always the newest build of main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AniBiar (latest build)
          body: Newest APK built from the main branch. Download app-release.apk and install it on your phone.
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: true
