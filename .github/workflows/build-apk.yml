name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: bash tool/setup_android.sh

      - run: flutter pub get

      - name: Analyze (errors fail the build; hints and warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build the APK
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ANIVEXA_URL: ${{ secrets.ANIVEXA_URL || vars.ANIVEXA_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          EXTRA=()
          for NAME in SITE_URL ANIVEXA_URL UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN TMDB_KEY; do
            if [ -n "${!NAME:-}" ]; then EXTRA+=("--dart-define=${NAME}=${!NAME}"); fi
          done
          flutter build apk --release "${EXTRA[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: AniBiar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to Releases (always the newest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AniBiar (latest build)
          body: Newest APK built from the main branch. Download app-release.apk and install it on your phone.
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
